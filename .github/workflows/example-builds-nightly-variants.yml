name: Example builds (nightly variants)

concurrency:
  # Skip intermediate builds: all builds except for builds on the `master`, `main`, or `release-*` branches
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/master' || github.ref != 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

on:
  push:
    branches: ['main', 'master', 'releases/*']
  pull_request:
  schedule:
    - cron: '37 17 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - nightly
        julia-variant:
          - opt
          - nogpl
        os:
          - ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ ! startsWith(github.ref, 'refs/heads/releases') }}
        with:
          node-version-file: '.tool-versions'

      - name: "Install dependencies"
        if: ${{ ! startsWith(github.ref, 'refs/heads/releases') }}
        run: |
          npm install
          npm run build
          npm run pack

      - name: "Set up Julia (${{ matrix.julia-version }}, variant ${{ matrix.julia-variant }})"
        uses: ./
        with:
          version: ${{ matrix.julia-version }}
          variants: ${{ matrix.julia-variant }}

      - run: julia --version
      - run: julia --compile=min -O0 -e 'import InteractiveUtils; InteractiveUtils.versioninfo()'
      - name: "Check that the correct julia is used and that archive mtimes are maintained"
        run: julia --startup-file=no --color=yes ./.github/scripts/common-tests.jl
      - name: "Check that the variant build is used"
        run: |
          julia --startup-file=no --color=yes -e 'occursin("+" * ENV["JULIA_VARIANT"], Sys.BINDIR) || error("not the $(ENV["JULIA_VARIANT"]) build: $(Sys.BINDIR)")'
        env:
          JULIA_VARIANT: ${{ matrix.julia-variant }}
